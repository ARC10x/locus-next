name: Locus Next Test IPA

on:
  push:
    branches: ["develop/locus-next"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: locus-next-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Run logic regression tests
        run: |
          python3 .github/scripts/logic-package.py
          swift test
      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install xcodegen
      - name: Generate separate test app
        run: |
          python3 .github/scripts/configure-next-build.py
          xcodegen generate --spec project.next.yml
      - name: Compile unsigned iPhone app
        run: |
          set -o pipefail
          xcodebuild -project Locus.xcodeproj -scheme Locus -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath build/LocusNext.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" archive > build/xcodebuild.log 2>&1 \
            || { tail -n 180 build/xcodebuild.log; exit 1; }
      - name: Verify isolation and package IPA
        run: |
          python3 .github/scripts/package-next.py
      - uses: actions/upload-artifact@v4
        with:
          name: Locus-Next-Test-${{ github.sha }}
          path: build/Locus-Next-Test.ipa
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Locus-Next-build-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
